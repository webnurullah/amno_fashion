<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day Close ‹ Amnu Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236250d6'/%3E%3Cpath d='M32 14 18 50h7l3-8h8l3 8h7zm-2.6 22 2.6-8 2.6 8z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="day-close">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1>Day close</h1><p class="muted">Count the drawer, compare it with the sales system and submit the day to the owner.</p></div>
          <div class="row gap-8 wrap"><select id="dc-loc" class="pill-select" aria-label="Showroom"></select><input id="dc-date" type="date" class="pill-select" aria-label="Date" style="width:auto;min-width:150px"></div>
        </div>
        <div class="dc-layout">
          <section class="card">
            <div class="card-h"><span class="card-title">Sales for the day</span><span id="dc-badge" class="badge"></span></div>
            <div id="dc-sales"></div>
          </section>
          <section class="card">
            <div class="card-h"><span class="card-title">Cash count</span><select id="dc-cashier" class="pill-select" aria-label="Submitted by"></select></div>
            <div id="dc-count"></div>
          </section>
          <section class="card">
            <div class="card-h"><span class="card-title">Reconciliation</span></div>
            <div id="dc-recon"></div>
          </section>
        </div>
        <h2 class="section-h">Close history</h2>
        <div id="history"></div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script>Amnu.admin.boot('day-close', Amnu.adminPages['day-close']);</script>
</body>
</html>
