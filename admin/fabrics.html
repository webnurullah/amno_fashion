<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabric Stock ‹ AMNO Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="fabrics">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1>Fabric stock</h1><p class="muted">Cloth in the warehouse, by name. Measured in yards and inches; one fabric can be cut into several designs.</p></div>
          <div class="row gap-8 wrap"><div class="seg" id="fab-unit" role="group" aria-label="Show quantities in"><button type="button" data-u="yd" aria-pressed="true">Yards</button><button type="button" data-u="in" aria-pressed="false">Inches</button></div><button class="btn btn-glass" id="fab-export" type="button"><i data-icon="download" data-size="18"></i> CSV</button><button class="btn btn-glass" id="add-fabric" type="button"><i data-icon="plus" data-size="18"></i> Add fabric</button><a class="btn btn-violet" href="purchases.html?new=1"><i data-icon="swap" data-size="18"></i> Buy fabric</a></div>
        </div>
        <section class="kpis" id="fab-kpis"></section>
        <div class="tabs" id="fab-tabs" role="tablist" style="align-self:flex-start">
          <button type="button" role="tab" data-tab="stock" aria-selected="true">Fabric in stock</button>
          <button type="button" role="tab" data-tab="moves" aria-selected="false">In &amp; out history</button>
        </div>
        <div id="list"></div>
        <div id="moves" hidden></div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/prod.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script src="../assets/js/admin-prod.js"></script>
  <script>Amnu.admin.boot('fabrics', Amnu.adminPages['fabrics']);</script>
</body>
</html>
