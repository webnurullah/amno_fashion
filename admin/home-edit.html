<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Home Page ‹ AMNU Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="home-edit">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1>Edit page: Home</h1><p class="muted">Every section of your home page. Turn sections on or off, change their order and text, and add new ones.</p></div>
          <a class="btn btn-glass" href="pages.html"><i data-icon="chevron-left" data-size="16"></i> All pages</a>
        </div>
        <div class="editor-layout">
          <div class="col gap-16" id="hm-sections"></div>
          <aside class="col gap-16">
            <div class="card metabox">
              <div class="metabox-h"><h3>Update</h3></div>
              <div class="metabox-b col gap-12">
                <div class="small muted" id="hm-count"></div>
                <button class="btn btn-violet btn-block" id="hm-save" type="button">Update</button>
                <a class="btn btn-glass btn-block" href="../index.html" target="_blank" rel="noopener"><i data-icon="external" data-size="16"></i> Preview home page</a>
                <button class="btn-link danger small" id="hm-reset" type="button">Reset to original layout</button>
              </div>
            </div>
            <div class="card metabox">
              <div class="metabox-h"><h3>Add a section</h3></div>
              <div class="metabox-b col gap-8">
                <button class="btn btn-glass btn-block" id="hm-add-collection" type="button"><i data-icon="plus" data-size="16"></i> Collection cards</button>
                <button class="btn btn-glass btn-block" id="hm-add-rail" type="button"><i data-icon="plus" data-size="16"></i> Product row</button>
                <p class="xs muted">New sections appear at the bottom. Use the arrows to move them.</p>
              </div>
            </div>
          </aside>
        </div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/prod.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script src="../assets/js/admin-prod.js"></script>
  <script>Amnu.admin.boot('home-edit', Amnu.adminPages['home-edit']);</script>
</body>
</html>
