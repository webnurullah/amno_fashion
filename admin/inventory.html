<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showroom Stock ‹ AMNO Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="inventory">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1>Showroom stock</h1><p class="muted">Finished panjabi ready to sell, by size. Production adds to it; showroom, website and social-media sales take from it.</p></div>
          <div class="row gap-8 wrap"><button class="btn btn-glass" id="inv-export" type="button"><i data-icon="download" data-size="18"></i> Export CSV</button></div>
        </div>
        <section class="kpis five" id="inv-kpis"></section>
        <div class="tabs" id="inv-tabs" role="tablist" style="align-self:flex-start">
          <button type="button" role="tab" data-tab="stock" aria-selected="true">Stock levels</button>
          <button type="button" role="tab" data-tab="moves" aria-selected="false">Stock movements</button>
        </div>
        <div id="list"></div>
        <div id="moves" hidden></div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/prod.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script src="../assets/js/admin-prod.js"></script>
  <script>Amnu.admin.boot('inventory', Amnu.adminPages['inventory']);</script>
</body>
</html>
