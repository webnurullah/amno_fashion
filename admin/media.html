<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Library ‹ AMNO Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="media">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1>Media library</h1><p class="muted">Product photos, lookbook images and banners.</p></div>
          <div class="row gap-8 wrap"><label class="btn btn-violet"><input type="file" id="media-input" accept="image/*" multiple hidden><i data-icon="upload" data-size="18"></i> Upload files</label></div>
        </div>
        <div class="media-layout">
          <section class="card">
            <label class="drop big" id="drop-zone"><i data-icon="upload" data-size="26"></i><span><b>Drop images here to upload</b><br><span class="xs muted">Images are resized and stored in this browser for the demo.</span></span></label>
            <div class="tablenav" style="padding:14px 0 12px">
              <select id="media-filter" aria-label="Filter media" style="width:auto"><option value="all">All media</option><option value="upload">Uploaded</option><option value="product">Product artwork</option></select>
              <div class="grow"></div>
              <span class="muted small" id="media-count"></span>
              <div class="input-group tn-search"><i data-icon="search"></i><input id="media-q" type="search" placeholder="Search media" aria-label="Search media"></div>
            </div>
            <div class="media-grid" id="media-grid"></div>
          </section>
          <aside class="card media-detail" id="media-detail"></aside>
        </div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/prod.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script src="../assets/js/admin-prod.js"></script>
  <script>Amnu.admin.boot('media', Amnu.adminPages['media']);</script>
</body>
</html>
