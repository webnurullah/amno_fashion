<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Page ‹ AMNU Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="page-edit">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1 id="pe-title">Edit page</h1><p class="muted">Change any text on this page of your website. Built-in pages cannot be deleted, only set to draft.</p></div>
          <a class="btn btn-glass" href="pages.html"><i data-icon="chevron-left" data-size="16"></i> All pages</a>
        </div>
        <div class="editor-layout">
          <div class="col gap-16" id="pe-main"></div>
          <aside class="col gap-16">
            <div class="card metabox">
              <div class="metabox-h"><h3>Publish</h3></div>
              <div class="metabox-b col gap-12">
                <div class="field"><label for="pe-status">Status</label><select id="pe-status"><option value="publish">Published</option><option value="draft">Draft (hidden from visitors)</option></select></div>
                <button class="btn btn-violet btn-block" id="pe-save" type="button">Update</button>
                <a class="btn btn-glass btn-block" id="pe-view" href="../index.html" target="_blank" rel="noopener"><i data-icon="external" data-size="16"></i> View page</a>
              </div>
            </div>
          </aside>
        </div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/prod.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script src="../assets/js/admin-prod.js"></script>
  <script>Amnu.admin.boot('page-edit', Amnu.adminPages['page-edit']);</script>
</body>
</html>
