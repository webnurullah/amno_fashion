<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plugins ‹ Amnu Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="plugins">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1>Plugins</h1><p class="muted">Payment, courier and marketing integrations. These switches are demo placeholders: connect each to a real gateway or API.</p></div>
          <div class="row gap-8 wrap"><button class="btn btn-violet" id="plugin-add" type="button"><i data-icon="plus" data-size="18"></i> Add new plugin</button></div>
        </div>
        <div class="card plugin-bar">
          <div class="chips" id="plugin-cats"></div>
          <div class="row gap-16"><span class="muted small" id="plugin-count"></span><div class="input-group tn-search"><i data-icon="search"></i><input id="plugin-q" type="search" placeholder="Search plugins" aria-label="Search plugins"></div></div>
        </div>
        <div class="plugin-grid" id="plugin-grid"></div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script>Amnu.admin.boot('plugins', Amnu.adminPages['plugins']);</script>
</body>
</html>
