<!doctype html>
<html lang="en" data-surface="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production ‹ Amnu Fashion Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/glass.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/core.js"></script>
</head>
<body data-page="production">
  <div class="bg" aria-hidden="true"></div>
  <div class="admin" id="admin">
    <aside class="sidebar glass" id="sidebar"></aside>

    <div class="admin-main">
      <header class="topbar glass" id="topbar"></header>

      <main class="content" id="content">
        <div class="page-head">
          <div><h1>Production</h1><p class="muted">Cut fabric into panjabi in the warehouse. Finished pieces go straight into showroom stock at their real cost.</p></div>
          <div class="row gap-8 wrap"><a class="btn btn-glass" href="fabrics.html"><i data-icon="package" data-size="18"></i> Fabric stock</a><button class="btn btn-violet" id="add-batch" type="button"><i data-icon="scissors" data-size="18"></i> New production batch</button></div>
        </div>
        <section class="kpis" id="pr-kpis"></section>
        <div class="tabs" id="pr-tabs" role="tablist" style="align-self:flex-start">
          <button type="button" role="tab" data-tab="batches" aria-selected="true">Batches</button>
          <button type="button" role="tab" data-tab="designs" aria-selected="false">Designs &amp; costing</button>
        </div>
        <div id="list"></div>
        <div id="designs" class="col gap-16" hidden></div>
      </main>

      <footer class="admin-footer" id="admin-footer"></footer>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ops.js"></script>
  <script src="../assets/js/prod.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/admin-core.js"></script>
  <script src="../assets/js/admin-pages.js"></script>
  <script src="../assets/js/admin-pages2.js"></script>
  <script src="../assets/js/admin-ops.js"></script>
  <script src="../assets/js/admin-fin.js"></script>
  <script src="../assets/js/admin-prod.js"></script>
  <script>Amnu.admin.boot('production', Amnu.adminPages['production']);</script>
</body>
</html>
