<!doctype html>
<html lang="en" data-surface="store">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — AMNU Fashion</title>
  <meta name="description" content="Premium Panjabi from AMNU Fashion. Shop online or visit a showroom.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/glass.css">
  <link rel="stylesheet" href="assets/css/store.css">
  <script src="assets/js/core.js"></script>
</head>
<body data-page="contact">
  <div class="bg" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main" class="">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevron-right" data-size="13"></i><span>Contact</span></nav>
      <div class="page-h"><div><h1 data-edit="contact.title" data-label="Page headline" data-group="Top section">Get in touch</h1><p class="muted" data-edit="contact.sub" data-label="Intro line" data-group="Top section">Questions about sizing, fabric or an order? We reply fastest on Messenger.</p></div></div>
      <div class="contact-layout">
        <div class="contact-grid">
          <a class="contact-card glass" id="cc-msgr" data-edit-link="contact.msgr" data-label="Messenger link" data-group="Contact cards" data-src="messenger" href="https://m.me/amnufashionbd" target="_blank" rel="noopener"><span class="v-ico"><i data-icon="message" data-size="22"></i></span><div><h3 data-edit="contact.c1t" data-label="Card 1 title" data-group="Contact cards">Messenger</h3><p class="muted small" data-edit="contact.c1d" data-label="Card 1 text" data-group="Contact cards">Fastest way to reach us</p></div><i data-icon="arrow-right" data-size="18"></i></a>
          <a class="contact-card glass" id="cc-phone" href="tel:"><span class="v-ico"><i data-icon="phone" data-size="22"></i></span><div><h3 data-edit="contact.c2t" data-label="Card 2 title" data-group="Contact cards">Call us</h3><p class="muted small" data-bind="phone" data-edit="contact.phone" data-label="Phone number" data-group="Contact cards" data-src="phone"></p></div><i data-icon="arrow-right" data-size="18"></i></a>
          <a class="contact-card glass" id="cc-mail" href="mailto:"><span class="v-ico"><i data-icon="mail" data-size="22"></i></span><div><h3 data-edit="contact.c3t" data-label="Card 3 title" data-group="Contact cards">Email</h3><p class="muted small" data-bind="email" data-edit="contact.email" data-label="Email address" data-group="Contact cards" data-src="email"></p></div><i data-icon="arrow-right" data-size="18"></i></a>
          <a class="contact-card glass" id="cc-stores" data-edit-link="contact.storesLink" data-label="Showroom card link" data-group="Contact cards" href="#stores"><span class="v-ico"><i data-icon="pin" data-size="22"></i></span><div><h3 data-edit="contact.c4t" data-label="Card 4 title" data-group="Contact cards">Visit a showroom</h3><p class="muted small" data-edit="contact.c4d" data-label="Card 4 text" data-group="Contact cards">See addresses and opening hours</p></div><i data-icon="arrow-right" data-size="18"></i></a>
        </div>
      </div>
      <section class="stores-sec" id="stores" data-pv="contact.storesTitle">
        <div class="stores-h"><span class="kicker" data-edit="contact.storesKicker" data-label="Small heading" data-group="Store locations">Visit us</span><h2 data-edit="contact.storesTitle" data-label="Section title" data-group="Store locations">Our stores</h2><p class="muted" data-edit="contact.storesSub" data-label="Intro line" data-group="Store locations">Try it on, feel the fabric, exchange in person.</p></div>
        <div class="store-grid" id="store-list"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ops.js"></script>
  <script src="assets/js/prod.js"></script>
  <script src="assets/js/store-core.js"></script>
  <script src="assets/js/store-pages.js"></script>
  <script src="assets/js/store-pages2.js"></script>
</body>
</html>
