<!doctype html>
<html lang="en" data-surface="store">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Amnu Fashion</title>
  <meta name="description" content="Premium Panjabi from Amnu Fashion. Shop online or visit a showroom.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23111114'/%3E%3Cpath d='M32 14 18 50h7l3-8h8l3 8h7zm-2.6 22 2.6-8 2.6 8z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/glass.css">
  <link rel="stylesheet" href="assets/css/store.css">
  <script src="assets/js/core.js"></script>
</head>
<body data-page="contact">
  <div class="bg" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main" class="">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevron-right" data-size="13"></i><span>Contact</span></nav>
      <div class="page-h"><div><h1>Get in touch</h1><p class="muted">Questions about sizing, fabric or an order? We reply fastest on Messenger.</p></div></div>
      <div class="contact-layout">
        <div class="col gap-16">
          <a class="contact-card glass" id="cc-msgr" href="https://m.me/amnufashionbd" target="_blank" rel="noopener"><span class="v-ico"><i data-icon="message" data-size="22"></i></span><div><h3>Messenger</h3><p class="muted small">Fastest way to reach us</p></div><i data-icon="arrow-right" data-size="18"></i></a>
          <a class="contact-card glass" id="cc-phone" href="tel:"><span class="v-ico"><i data-icon="phone" data-size="22"></i></span><div><h3>Call us</h3><p class="muted small" data-bind="phone"></p></div><i data-icon="arrow-right" data-size="18"></i></a>
          <a class="contact-card glass" id="cc-mail" href="mailto:"><span class="v-ico"><i data-icon="mail" data-size="22"></i></span><div><h3>Email</h3><p class="muted small" data-bind="email"></p></div><i data-icon="arrow-right" data-size="18"></i></a>
          <a class="contact-card glass" href="stores.html"><span class="v-ico"><i data-icon="pin" data-size="22"></i></span><div><h3>Visit a showroom</h3><p class="muted small">See addresses and opening hours</p></div><i data-icon="arrow-right" data-size="18"></i></a>
        </div>
        <form class="glass pad" id="contact-form" data-demo-form="Message received (demo: connect this form to your backend)." novalidate>
          <h2 class="h2s">Send us a message</h2>
          <div class="form-grid">
            <div class="field"><label for="m-name">Your name</label><input id="m-name" type="text" required placeholder="Full name"></div>
            <div class="field"><label for="m-phone">Mobile or email</label><input id="m-phone" type="text" required placeholder="01XXXXXXXXX"></div>
            <div class="field full"><label for="m-topic">Topic</label><select id="m-topic"><option>Order status</option><option>Size &amp; fit help</option><option>Exchange or return</option><option>Bulk / wedding orders</option><option>Something else</option></select></div>
            <div class="field full"><label for="m-msg">Message</label><textarea id="m-msg" rows="5" required placeholder="How can we help?"></textarea></div>
          </div>
          <button class="btn btn-primary btn-lg" type="submit">Send message</button>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ops.js"></script>
  <script src="assets/js/store-core.js"></script>
  <script src="assets/js/store-pages.js"></script>
  <script src="assets/js/store-pages2.js"></script>
</body>
</html>
