<!doctype html>
<html lang="en" data-surface="store">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Panjabi — Amnu Fashion</title>
  <meta name="description" content="Browse the full Panjabi collection: Eid, wedding, embroidered, casual cotton, silk and kids.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23111114'/%3E%3Cpath d='M32 14 18 50h7l3-8h8l3 8h7zm-2.6 22 2.6-8 2.6 8z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/glass.css">
  <link rel="stylesheet" href="assets/css/store.css">
  <script src="assets/js/core.js"></script>
</head>
<body data-page="shop">
  <div class="bg" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main" class="">
    <div class="subnav"><div class="container"><div class="chips" id="sub-chips"></div></div></div>
    <div class="container">
      <div class="listing-bar" id="filter-bar">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevron-right" data-size="13"></i><span><span id="crumb-cat">All Panjabi</span></span></nav>
        <div class="filter-row">
          <div class="fb-wrap"><button class="fb" id="fb-color" data-pop="color" type="button" aria-haspopup="true">Color <i data-icon="chevron-down" data-size="16"></i></button><div class="pop glass-strong"></div></div>
          <div class="fb-wrap"><button class="fb" id="fb-size" data-pop="size" type="button" aria-haspopup="true">Size <i data-icon="chevron-down" data-size="16"></i></button><div class="pop glass-strong"></div></div>
          <div class="fb-wrap"><button class="fb" id="fb-price" data-pop="price" type="button" aria-haspopup="true">Price <i data-icon="chevron-down" data-size="16"></i></button><div class="pop glass-strong"></div></div>
          <div class="fb-wrap sort"><button class="fb" id="fb-sort" data-pop="sort" type="button" aria-haspopup="true"><span>Sort: Default</span> <i data-icon="chevron-down" data-size="16"></i></button><div class="pop glass-strong right"></div></div>
        </div>
      </div>
      <div class="promo-strip" id="promo-strip"></div>
      <div class="row between wrap list-meta"><span class="muted small" id="shop-count"></span><div class="active-filters" id="active-filters"></div></div>
      <div class="grid-products" id="shop-grid"></div>
      <div class="center" style="margin:36px 0 10px"><button class="btn btn-outline btn-lg" id="load-more" type="button" hidden>Load more</button></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ops.js"></script>
  <script src="assets/js/store-core.js"></script>
  <script src="assets/js/store-pages.js"></script>
  <script src="assets/js/store-pages2.js"></script>
</body>
</html>
