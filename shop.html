<!doctype html>
<html lang="en" data-surface="store">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Panjabi — Amnu Fashion</title>
  <meta name="description" content="Browse the full Panjabi collection: Eid, wedding, embroidered, casual cotton, silk and kids.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ff7a59'/%3E%3Cpath d='M32 14 18 50h7l3-8h8l3 8h7zm-2.6 22 2.6-8 2.6 8z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/glass.css">
  <link rel="stylesheet" href="assets/css/store.css">
  <script src="assets/js/core.js"></script>
</head>
<body data-page="shop">
  <div class="bg" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main" class="container page">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevron-right" data-size="14"></i><span>Shop</span></nav>

    <div class="page-h">
      <div>
        <h1 id="shop-title">All Panjabi</h1>
        <p class="muted" id="shop-count">Loading…</p>
      </div>
      <div class="shop-tools">
        <button class="btn btn-glass btn-sm" id="filter-open" type="button"><i data-icon="filter" data-size="16"></i> Filters</button>
        <div class="input-group tool-search"><i data-icon="search"></i><input id="shop-q" type="search" placeholder="Search products" aria-label="Search products"></div>
        <select id="shop-sort" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="new">Newest</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating">Top rated</option>
          <option value="popular">Best selling</option>
        </select>
        <div class="seg" id="view-toggle" role="group" aria-label="Layout">
          <button type="button" data-view="grid" aria-pressed="true" aria-label="Grid view"><i data-icon="grid" data-size="18"></i></button>
          <button type="button" data-view="list" aria-pressed="false" aria-label="List view"><i data-icon="list" data-size="18"></i></button>
        </div>
      </div>
    </div>

    <div class="shop-layout">
      <aside class="filters glass" id="filters" aria-label="Product filters">
        <div class="filters-h"><h3>Filters</h3><button class="btn btn-ghost btn-icon btn-sm filters-close" id="filter-close" type="button" aria-label="Close filters"><i data-icon="x" data-size="18"></i></button></div>

        <div class="f-block"><h4>Category</h4><div class="col gap-8" id="f-cats"></div></div>

        <div class="f-block">
          <h4>Max price <span class="muted" id="f-price-val"></span></h4>
          <input type="range" id="f-price" min="1000" max="8000" step="50" value="8000" aria-label="Maximum price">
          <div class="row between xs muted"><span id="f-price-lo">৳1,000</span><span id="f-price-hi">৳8,000</span></div>
        </div>

        <div class="f-block"><h4>Size</h4><div class="row wrap gap-8" id="f-sizes"></div></div>
        <div class="f-block"><h4>Colour</h4><div class="row wrap gap-8" id="f-colors"></div></div>

        <div class="f-block">
          <label class="row between"><span class="bold small">In stock only</span><span class="switch"><input type="checkbox" id="f-stock"><span></span></span></label>
          <label class="row between"><span class="bold small">On sale</span><span class="switch"><input type="checkbox" id="f-sale"><span></span></span></label>
        </div>

        <button class="btn btn-glass btn-block" id="f-reset" type="button">Reset filters</button>
      </aside>

      <section class="shop-results">
        <div class="active-filters" id="active-filters"></div>
        <div class="grid-products" id="shop-grid"></div>
        <nav class="pager" id="pager" aria-label="Pagination"></nav>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
</body>
</html>
