<!doctype html>
<html lang="en" data-surface="store">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Your Order — Amnu Fashion</title>
  <meta name="description" content="Premium Panjabi from Amnu Fashion. Shop online or visit a showroom.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/glass.css">
  <link rel="stylesheet" href="assets/css/store.css">
  <script src="assets/js/core.js"></script>
</head>
<body data-page="track">
  <div class="bg" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main" class="narrow-main">
    <div class="container narrow">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevron-right" data-size="13"></i><span>Track order</span></nav>
      <div class="page-h"><div><h1>Track your order</h1><p class="muted">Enter your order number and the mobile number used at checkout.</p></div></div>
      <form class="glass pad track-form" id="track-form" novalidate>
        <div class="field"><label for="t-id">Order number</label><input id="t-id" type="text" inputmode="numeric" placeholder="e.g. 1241" required></div>
        <div class="field"><label for="t-phone">Mobile number</label><input id="t-phone" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" required></div>
        <button class="btn btn-primary btn-lg" type="submit">Track order</button>
      </form>
      <div id="track-result" aria-live="polite"></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ops.js"></script>
  <script src="assets/js/prod.js"></script>
  <script src="assets/js/store-core.js"></script>
  <script src="assets/js/store-pages.js"></script>
  <script src="assets/js/store-pages2.js"></script>
</body>
</html>
